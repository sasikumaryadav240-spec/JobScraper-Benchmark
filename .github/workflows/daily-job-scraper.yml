name: Daily Job Scraper & Matching Pipeline

on:
  schedule:
    # 9:17 AM IST = 03:47 UTC
    - cron: "47 3 * * *"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "Pipeline execution mode"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - full
          - skip_scraping

permissions:
  contents: read

concurrency:
  group: daily-job-scraper
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite Verification
        run: |
          python -m unittest discover tests -v

      - name: Execute Daily Pipeline
        run: |
          MODE="${{ github.event.inputs.run_mode || 'daily' }}"
          if [ "$MODE" = "full" ]; then
            python run_daily_pipeline.py --full-run
          elif [ "$MODE" = "skip_scraping" ]; then
            python run_daily_pipeline.py --skip-scraping
          else
            python run_daily_pipeline.py --daily-run
          fi

      - name: Upload Daily Artifacts (JSON, CSV, Excel, Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-results-${{ github.run_number }}
          path: |
            jobspy/*.json
            jobspy/*.jsonl
            jobspy/*.csv
            jobspy/*.xlsx
            jobspy/*.md
          if-no-files-found: warn
          retention-days: 7
